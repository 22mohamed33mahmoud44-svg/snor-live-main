name: Deploy Readiness

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Test LiveKit authorization rules
        run: node --test supabase/functions/livekit-token/authorization.test.mjs

      - name: Ensure LiveKit remote audio rendering and playback recovery are wired
        run: node --test tests/unit/livekitAudioRendering.test.mjs

      - name: Ensure call mute and camera controls update LiveKit tracks
        run: node --test tests/unit/livekitMediaControls.test.mjs

      - name: Check safe retry for failed-call exit and active-call hangup
        run: node --test tests/unit/callExitFailureWiring.test.mjs

      - name: Restore call chat history after reconnect without losing live messages
        run: node --test tests/unit/callChatHistoryWiring.test.mjs

      - name: Confirm outgoing call chat messages appear without a Realtime echo
        run: node --test tests/unit/callChatSavedAckWiring.test.mjs

      - name: Verify timed call setup and fresh LiveKit retry wiring
        run: node --test tests/unit/videoCallConnectionTimeout.test.mjs

      - name: Check viewer-only subscription and broadcaster media publishing
        run: node --test tests/unit/liveStreamMediaWiring.test.mjs

      - name: Ensure stream shutdown is confirmed by the server before unmount
        run: node --test tests/unit/liveStreamShutdownWiring.test.mjs

      - name: Check broadcaster and viewer chat draft safety
        run: node --test tests/unit/liveStreamChatWiring.test.mjs

      - name: Preserve latest live stream chat during historical message fetches
        run: node --test tests/unit/streamChatHistoryWiring.test.mjs

      - name: Verify viewer likes survive failed batch writes and exit
        run: node --test tests/unit/viewerLikeBatchWiring.test.mjs

      - name: Prevent invalid like broadcasts and stale counter snapshots
        run: node --test tests/unit/liveLikeCounterWiring.test.mjs

      - name: Prevent indefinite viewer stream connection loading
        run: node --test tests/unit/viewerStreamConnectionWiring.test.mjs

      - name: Ignore old viewer LiveKit room callbacks during retry
        run: node --test tests/unit/viewerStaleRoomCallbacks.test.mjs

      - name: Check broadcaster token and publishing recovery
        run: node --test tests/unit/broadcasterConnectionRecovery.test.mjs

      - name: Ignore stale broadcaster publishing and LiveKit callbacks on reconnect
        run: node --test tests/unit/broadcasterStaleRoomCallbacks.test.mjs

      - name: Ensure broadcaster media capture stops on unmount and handles permission failures
        run: node --test tests/unit/broadcasterCameraLifecycleWiring.test.mjs

      - name: Prevent duplicate livestream creation and camera leaks in studio
        run: node --test tests/unit/liveStreamLaunchWiring.test.mjs

      - name: Ensure closing matchmaking cancels pending start and any late random match
        run: node --test tests/unit/randomMatchUnmountWiring.test.mjs

      - name: Test Stripe checkout input rules
        run: node --test supabase/functions/create-checkout/checkout-validation.test.mjs

      - name: Test Stripe webhook paid-price and buyer verification
        run: node --test supabase/functions/stripe-webhook/checkout-credit-validation.test.mjs

      - name: Verify recovered production migration archive integrity
        run: node scripts/check-production-history.mjs

      - name: Verify security patches are in executable migration chain
        run: node scripts/check-security-migration-parity.mjs

      - name: Guard against unexpected migration history drift
        run: node scripts/report-migration-drift.mjs --report

      - name: Verify deploy/database readiness
        run: node scripts/verify-deploy-readiness.mjs

      - name: Typecheck app
        run: npm run typecheck

      - name: Build app
        run: npm run build
  single-active-stream-database-tests:
    name: Prevent simultaneous streams on disposable PostgreSQL 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: snor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d snor_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Test active-stream uniqueness, history and duplicate preflight
        env:
          PGPASSWORD: postgres
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: snor_test
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/single_live_stream_setup.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/security_patches/20261030_one_active_stream_per_owner.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/single_live_stream_assertions.sql

          # The same patch must fail cleanly rather than silently ending
          # already-active streams if pre-existing duplicates are present.
          createdb snor_preflight
          PGDATABASE=snor_preflight psql -X -v ON_ERROR_STOP=1 -f tests/sql/single_live_stream_duplicates_setup.sql
          if PGDATABASE=snor_preflight psql -X -v ON_ERROR_STOP=1 -f supabase/security_patches/20261030_one_active_stream_per_owner.sql > /tmp/single-live-preflight.log 2>&1; then
            echo 'ERROR: duplicate-active preflight unexpectedly succeeded'
            exit 1
          fi
          if ! grep -q 'Existing duplicate active streams' /tmp/single-live-preflight.log; then
            cat /tmp/single-live-preflight.log
            echo 'ERROR: preflight failed for an unexpected reason'
            exit 1
          fi
          PGDATABASE=snor_preflight psql -X -v ON_ERROR_STOP=1 -f tests/sql/single_live_stream_preflight_assertions.sql

