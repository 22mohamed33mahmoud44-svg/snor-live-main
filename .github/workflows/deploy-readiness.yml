        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d snor_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Test real SQL migration and atomic gift accounting
        env:
          PGPASSWORD: postgres
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: snor_test
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/gift_prices_setup.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261030020000_022_validate_gift_catalog_prices.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/gift_prices_assertions.sql

  profile-privacy-database-tests:
