          psql -X -v ON_ERROR_STOP=1 -f supabase/security_patches/20261030_profile_privacy.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/profile_privacy_assertions.sql

  anon-rpc-security-tests:
