  edge-functions-typecheck:
    name: Typecheck Supabase Edge Functions with Deno 2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck LiveKit token and Stripe functions
        run: |
          deno check --no-lock --node-modules-dir=auto supabase/functions/livekit-token/index.ts
          deno check --no-lock --node-modules-dir=auto supabase/functions/stripe-webhook/index.ts
          deno check --no-lock --node-modules-dir=auto supabase/functions/create-checkout/index.ts

      - name: Test signup confirmation and authenticated session routing
        run: deno test tests/unit/emailAuthOutcome.test.ts

      - name: Ensure unsafe Vercel previews cannot initialize the application
        run: deno test tests/unit/previewSafety.test.ts

      - name: Test new-account profile field requirements
        run: deno test tests/unit/profileDefaults.test.ts

      - name: Prevent incomplete profiles and failed profile lookups from reaching dashboard
        run: deno test tests/unit/profileGate.test.ts

      - name: Validate age at exact birthday boundaries
        run: deno test tests/unit/ageEligibility.test.ts

      - name: Test cancellation never terminates a direct call
        run: deno test tests/unit/cancelRandomMatch.test.ts

      - name: Check signed LiveKit token media permissions
        run: deno test --allow-env --no-lock --node-modules-dir=auto supabase/functions/livekit-token/token-grants.test.mjs

