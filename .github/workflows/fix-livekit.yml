name: Fix LiveKit visibility heartbeat

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch ActiveLiveRoom heartbeat
        shell: python
        run: |
          from pathlib import Path
          p = Path('snor-live-main/src/components/ActiveLiveRoom.tsx')
          s = p.read_text()
          old = """    const handleVisibilityChange = () => {\n      if (document.visibilityState === 'hidden') {\n        stopHeartbeat();\n        navigator.sendBeacon(`${import.meta.env.VITE_SUPABASE_URL}/rest/v1/live_streams?id=eq.${streamId}`, JSON.stringify({ is_live: false }));\n      } else { startHeartbeat(); }\n    };"""
          new = """    const handleVisibilityChange = () => {\n      // Do not end the stream just because the page/app becomes hidden.\n      // Backgrounded tabs may temporarily pause/throttle timers; the\n      // server-side cleanup/heartbeat logic decides when a stream is dead.\n      if (document.visibilityState === 'visible') {\n        startHeartbeat();\n      }\n    };"""
          if old not in s:
              raise SystemExit('Target block not found; no changes made.')
          p.write_text(s.replace(old, new))
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add snor-live-main/src/components/ActiveLiveRoom.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: keep live stream heartbeat across visibility changes'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-livekit.yml
          git commit -m 'chore: remove temporary LiveKit fix workflow'
          git push
