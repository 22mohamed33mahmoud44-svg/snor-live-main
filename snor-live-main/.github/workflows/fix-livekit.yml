name: Apply LiveKit repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'Fix LiveKit error handling')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch VideoCall
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('snor-live-main/src/VideoCall.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace("type ErrorType = 'camera_denied' | 'camera_not_found' | 'connection_timeout' | 'connection_failed' | null;", "type ErrorType = 'camera_denied' | 'camera_not_found' | 'connection_timeout' | 'connection_failed' | null;\n\nconst classifyLiveKitError = (error: unknown): Exclude<ErrorType, null> => {\n  const message = error instanceof Error ? error.message.toLowerCase() : String(error ?? '').toLowerCase();\n  const name = error instanceof Error ? error.name.toLowerCase() : '';\n  if (name.includes('notallowed') || message.includes('notallowederror') || message.includes('permission denied') || message.includes('permissiondenied')) return 'camera_denied';\n  if (name.includes('notfound') || message.includes('notfounderror') || message.includes('device not found') || message.includes('no camera')) return 'camera_not_found';\n  if (name.includes('timeout') || message.includes('timeout')) return 'connection_timeout';\n  return 'connection_failed';\n};")
          s = s.replace("  const [camOff, setCamOff] = useState(false);", "  const [camOff, setCamOff] = useState(false);\n  const [tokenLoading, setTokenLoading] = useState(true);\n  const [retryKey, setRetryKey] = useState(0);")
          s = s.replace("  useEffect(() => {\n    let isMounted = true;", "  useEffect(() => {\n    let isMounted = true;\n    setToken(null);\n    setError(null);\n    setTokenLoading(true);")
          s = s.replace("        if (isMounted) setToken(data.token);\n      } catch (err) {\n        if (isMounted) setError('connection_failed');\n      }\n    };\n    fetchToken();", "        if (isMounted) setToken(data.token);\n      } catch (err) {\n        console.error('LiveKit token request failed:', err);\n        if (isMounted) setError('connection_failed');\n      } finally {\n        if (isMounted) setTokenLoading(false);\n      }\n    };\n    void fetchToken();")
          s = s.replace("  }, [matchId, userId]);", "  }, [matchId, userId, retryKey]);", 1)
          s = s.replace("\n  // شاشة الخطأ الفخمة", "\n  const retryConnection = () => {\n    setError(null);\n    setToken(null);\n    setRetryKey(key => key + 1);\n  };\n\n  // شاشة الخطأ الفخمة")
          s = s.replace("onClick={() => { setError(null); globalThis.location.reload(); }}", "onClick={retryConnection}")
          s = s.replace("  if (!token) return null; // ننتظر حتى يأتي التوكن", "  if (tokenLoading || !token) return (\n    <div className=\"vc-premium-error-pane\">\n      <style>{STYLES}</style>\n      <div className=\"vc-error-icon-box\"><VideoIcon /></div>\n      <h2>جاري تجهيز الاتصال</h2>\n      <p>نقوم بتجهيز الاتصال الآمن بالفيديو، لحظات...</p>\n    </div>\n  );")
          s = s.replace("onError={() => setError('camera_denied')} // التقاط أخطاء الرفض", "onError={(liveKitError) => setError(classifyLiveKitError(liveKitError))}")
          s = s.replace("setMuted: any, camOff: boolean, setCamOff: any", "setMuted: React.Dispatch<React.SetStateAction<boolean>>, camOff: boolean, setCamOff: React.Dispatch<React.SetStateAction<boolean>>")
          if 'globalThis.location.reload()' in s:
              raise SystemExit('reload replacement failed')
          if "onError={() => setError('camera_denied')}" in s:
              raise SystemExit('onError replacement failed')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snor-live-main/src/VideoCall.tsx
          git commit -m "Fix LiveKit error handling" || exit 0
          git push
